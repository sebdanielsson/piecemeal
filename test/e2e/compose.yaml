# End-to-end test stack: piecemeal, a seeder, a real qBittorrent for the
# contract tests, and Radarr, Sonarr and Prowlarr using piecemeal as their
# qBittorrent download client. Run from the repository root with
# test/e2e/run.sh, which prepares ./tmp and runs the Go tests.
name: piecemeal-e2e

x-arr: &arr
  environment:
    PUID: "65532"
    PGID: "65532"
    TZ: Etc/UTC
  depends_on:
    - piecemeal

services:
  piecemeal:
    build:
      context: ../..
    image: piecemeal:e2e
    environment:
      PIECEMEAL_ADMIN_PASSWORD_HASH: ${PIECEMEAL_ADMIN_PASSWORD_HASH:-}
      PIECEMEAL_SECURE_COOKIES: "false"
      PIECEMEAL_METRICS: public
      PIECEMEAL_LOG_FORMAT: text
      PIECEMEAL_LOG_LEVEL: debug
      # The seeder is on the private test network.
      PIECEMEAL_FETCH_ALLOWED_NETWORKS: 172.30.0.0/24
    volumes:
      - ./tmp/downloads:/downloads
    ports:
      - 127.0.0.1:18080:8080
    networks:
      e2e:
        ipv4_address: 172.30.0.10

  seeder:
    build:
      context: ../..
      dockerfile: test/e2e/seeder/Dockerfile
    # Seeds the video run.sh makes, so Radarr can import it.
    command: ["-advertise", "172.30.0.20", "-out", "/shared", "-size", "0"]
    volumes:
      - ./tmp/shared:/shared
      - ./tmp/seed:/seed
    networks:
      e2e:
        ipv4_address: 172.30.0.20

  qbittorrent:
    # renovate: datasource=docker
    image: qbittorrentofficial/qbittorrent-nox:5.3.0-2
    environment:
      QBT_LEGAL_NOTICE: confirm
      # qBittorrent refuses requests whose Host header names another port
      # than its own, so it listens on the published port.
      QBT_WEBUI_PORT: "18081"
    ports:
      - 127.0.0.1:18081:18081
    networks:
      e2e:
        ipv4_address: 172.30.0.30

  radarr:
    <<: *arr
    image: lscr.io/linuxserver/radarr:7.0.3.10918-ls328
    volumes:
      - ./tmp/radarr:/config
      - ./tmp/downloads:/downloads
      - ./tmp/movies:/movies
    ports:
      - 127.0.0.1:17878:7878
    networks:
      e2e:
        ipv4_address: 172.30.0.40

  sonarr:
    <<: *arr
    image: lscr.io/linuxserver/sonarr:4.0.20.3014-ls5
    volumes:
      - ./tmp/sonarr:/config
    ports:
      - 127.0.0.1:18989:8989
    networks:
      e2e:
        ipv4_address: 172.30.0.41

  prowlarr:
    <<: *arr
    image: lscr.io/linuxserver/prowlarr:3.0.2.5780-ls169
    volumes:
      - ./tmp/prowlarr:/config
    ports:
      - 127.0.0.1:19696:9696
    networks:
      e2e:
        ipv4_address: 172.30.0.42

networks:
  e2e:
    ipam:
      config:
        - subnet: 172.30.0.0/24
