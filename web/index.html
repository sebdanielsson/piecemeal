<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%23292524'/%3E%3Cpath d='M6 22h4v4H6zM12 16h4v10h-4zM18 10h4v16h-4zM24 6h4v20h-4z' fill='%23fafaf9'/%3E%3C/svg%3E"
    />
    <title>piecemeal</title>
    <script>
      // Apply the saved theme before the first paint (see src/lib/theme.tsx).
      try {
        var t = JSON.parse(localStorage.getItem("piecemeal.theme") || '"system"');
        if (t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches)) {
          document.documentElement.classList.add("dark");
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
