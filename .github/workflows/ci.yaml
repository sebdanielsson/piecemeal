---
name: CI

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Installs the versions pinned in mise.toml, the same ones used locally.
      - name: Setup tools
        uses: jdx/mise-action@v5
        with:
          install_args: node npm:pnpm

      - name: Install dependencies
        run: pnpm -C web install --frozen-lockfile

      - name: Run format check
        run: pnpm -C web run fmt:check

      - name: Run lint
        run: pnpm -C web run lint

      - name: Run type check
        run: pnpm -C web run typecheck

      - name: Run tests
        run: pnpm -C web test

      # src/api/schema.d.ts is generated from api/openapi.json and committed.
      - name: Check generated API client
        run: |
          pnpm -C web gen:api
          git diff --exit-code -- web/src/api/schema.d.ts

      - name: Build
        run: pnpm -C web build

  go:
    name: Go
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Go comes from mise.toml rather than go.mod's `go` line: govulncheck reports stdlib
      # vulnerabilities for the toolchain it runs on, and go.mod states the minimum version,
      # not the patched one to build with.
      - name: Setup tools
        uses: jdx/mise-action@v5
        with:
          install_args: go aqua:golangci/golangci-lint go:golang.org/x/vuln/cmd/govulncheck aqua:sqlc-dev/sqlc

      # The web job builds and checks the UI. Go only needs the embed directory to exist.
      - name: Create empty web UI embed directory
        run: mkdir -p internal/webui/dist && touch internal/webui/dist/.keep

      - name: Run golangci-lint
        run: golangci-lint run

      # Generated code is committed: the store's queries (sqlc) and the native
      # API's OpenAPI document, which the web client is generated from.
      - name: Check generated code
        run: |
          sqlc diff
          go run ./cmd/piecemeal openapi > api/openapi.json
          git diff --exit-code -- api/openapi.json

      - name: Run tests
        run: go test -race ./...

      - name: Run govulncheck
        run: govulncheck ./...

      - name: Build
        run: CGO_ENABLED=0 go build -trimpath ./cmd/piecemeal

  docker:
    name: Docker
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Builds both release platforms without pushing, so a broken Dockerfile shows up in the PR
      # instead of in the release run.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Radarr, Sonarr and Prowlarr containers use piecemeal as their qBittorrent
  # download client, and a real qBittorrent is compared with piecemeal's
  # qBittorrent API. See test/e2e.
  e2e:
    name: End-to-end
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup tools
        uses: jdx/mise-action@v5
        with:
          install_args: go

      - name: Run end-to-end tests
        run: test/e2e/run.sh

      - name: Upload container logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-logs
          path: test/e2e/tmp/compose.log
          if-no-files-found: ignore

  # The one check the main ruleset requires, so adding or renaming jobs never means editing
  # the ruleset. `always()` makes it run, and fail, when a needed job failed or was cancelled,
  # instead of being skipped (a skipped required check counts as passing).
  ci:
    name: ci
    if: always()
    needs:
      - web
      - go
      - docker
      - e2e
    runs-on: ubuntu-26.04-arm
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
