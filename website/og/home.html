<!doctype html>
<!--
  The home page's Open Graph card. Regenerate public/og-home.png with
  og/render.sh after changing it.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500&family=Noto+Sans:wght@400;600&family=Playfair+Display:wght@600&display=block"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: oklch(0.147 0.004 49.3);
        --fg: #fafaf9;
        --muted: #a8a29e;
        --border: #292524;
        --have: oklch(0.72 0.13 155);
        --down: oklch(0.7 0.13 250);
        --missing: #292524;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "Noto Sans", sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background:
          radial-gradient(640px 420px at 88% 18%, oklch(0.72 0.13 155 / 0.16), transparent 70%),
          radial-gradient(520px 360px at 70% 105%, oklch(0.7 0.13 250 / 0.1), transparent 70%),
          var(--bg);
      }
      /* The app, tilted, running off the right edge. */
      .shot {
        position: absolute;
        left: 628px;
        top: 70px;
        width: 900px;
        border: 1px solid #44403c;
        border-radius: 10px;
        overflow: hidden;
        transform: perspective(1600px) rotateY(-16deg) rotateX(5deg) rotateZ(1deg);
        transform-origin: left center;
        box-shadow:
          0 40px 80px -20px rgb(0 0 0 / 0.75),
          0 0 0 1px rgb(255 255 255 / 0.04);
      }
      .shot .bar {
        height: 26px;
        background: #1c1917;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: center;
        gap: 7px;
        padding: 0 12px;
      }
      .shot .bar i {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: #44403c;
      }
      .shot img {
        display: block;
        width: 100%;
      }
      /* Fade the screenshot into the background at the bottom. */
      .fade {
        position: absolute;
        inset: auto 0 0 0;
        height: 190px;
        background: linear-gradient(to bottom, transparent, var(--bg) 78%);
      }
      .text {
        position: absolute;
        left: 72px;
        top: 64px;
        width: 540px;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 14px;
        font-weight: 600;
        font-size: 30px;
        letter-spacing: -0.01em;
      }
      .brand svg {
        width: 40px;
        height: 40px;
      }
      .kicker {
        margin-top: 54px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: var(--have);
      }
      h1 {
        margin-top: 18px;
        font-family: "Playfair Display", serif;
        font-weight: 600;
        font-size: 88px;
        line-height: 0.98;
        letter-spacing: -0.02em;
      }
      .lede {
        margin-top: 26px;
        font-size: 24px;
        line-height: 1.42;
        color: var(--muted);
      }
      .lede b {
        color: var(--fg);
        font-weight: 600;
      }
      /* A strip of the piece map, as in the web UI's Pieces tab. */
      .pieces {
        position: absolute;
        left: 72px;
        bottom: 56px;
        display: grid;
        grid-template-columns: repeat(34, 12px);
        grid-auto-rows: 12px;
        gap: 3px;
      }
      .pieces i {
        background: var(--missing);
      }
      .pieces i.h {
        background: var(--have);
      }
      .pieces i.d {
        background: var(--down);
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="shot">
        <div class="bar"><i></i><i></i><i></i></div>
        <img src="../assets/screens/pieces-dark.png" alt="" />
      </div>
      <div class="fade"></div>
      <div class="text">
        <div class="brand">
          <svg viewBox="0 0 32 32" aria-hidden="true">
            <rect width="32" height="32" fill="#fafaf9" />
            <path fill="#1c1917" d="M6 22h4v4H6zm6-6h4v10h-4zm6-6h4v16h-4zm6-4h4v20h-4z" />
          </svg>
          piecemeal
        </div>
        <p class="kicker">Self-hosted BitTorrent · Go · MIT</p>
        <h1>Every piece,<br />in its place.</h1>
        <p class="lede">
          A drop-in qBittorrent for <b>Radarr</b>, <b>Sonarr</b> and <b>Prowlarr</b>, with a web UI and SSO.
        </p>
      </div>
      <div class="pieces" id="pieces"></div>
    </div>
    <script>
      // Two rows of a torrent part-way through: verified pieces first, a few
      // downloading at the front, and the rest still missing.
      const el = document.getElementById("pieces");
      for (let i = 0; i < 68; i++) {
        const col = i % 34;
        const piece = document.createElement("i");
        const front = i < 34 ? 23 : 20;
        if (col < front - 3 || (col < front && (i * 7) % 3 !== 0)) piece.className = "h";
        else if (col < front + 4) piece.className = "d";
        el.appendChild(piece);
      }
    </script>
  </body>
</html>
