overlay: 1.0.0
info:
  title: Public API docs
  version: 1.0.0
# api/openapi.json is generated by `piecemeal openapi`, whose servers entry is
# relative and whose version is the build's. Give the reference a placeholder
# public server for its code samples, and the API's own version.
actions:
  - target: $.servers
    remove: true
  - target: $
    update:
      servers:
        - url: https://piecemeal.example.com/api/piecemeal/v1
          description: Your piecemeal
  - target: $.info
    update:
      title: piecemeal API
      version: v1
